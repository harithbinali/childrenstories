<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--blue-500)"></b><span>Sky blue</span><em>--blue-500 · #2F7DF0</em></div><div class="sw"><b style="background:var(--blue-700)"></b><span>Deep sky</span><em>--blue-700 · #1748A8</em></div><div class="sw"><b style="background:var(--sun-400)"></b><span>Sunshine</span><em>--sun-400 · #FFC93C</em></div><div class="sw"><b style="background:var(--sun-600)"></b><span>Sun edge</span><em>--sun-600 · #E09600</em></div><div class="sw"><b style="background:var(--cherry-500)"></b><span>Cherry</span><em>--cherry-500 · #EB3540</em></div><div class="sw"><b style="background:var(--cherry-600)"></b><span>Cherry edge</span><em>--cherry-600 · #C7202C</em></div></div></body></html>
