<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--tint-sun)"></b><span>Sun</span><em>--tint-sun · #FFF3C8</em></div><div class="sw"><b style="background:var(--tint-sky)"></b><span>Sky</span><em>--tint-sky · #DCEBFF</em></div><div class="sw"><b style="background:var(--tint-bubble)"></b><span>Bubble</span><em>--tint-bubble · #FFE4F0</em></div><div class="sw"><b style="background:var(--tint-mint)"></b><span>Mint</span><em>--tint-mint · #DDF6E8</em></div><div class="sw"><b style="background:var(--tint-grape)"></b><span>Grape</span><em>--tint-grape · #ECE5FF</em></div><div class="sw"><b style="background:var(--tint-tangerine)"></b><span>Tangerine</span><em>--tint-tangerine · #FFE7D3</em></div></div></body></html>
