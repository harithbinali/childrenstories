<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--ink-900)"></b><span>Ink 900</span><em>--ink-900 · #1B2457</em></div><div class="sw"><b style="background:var(--ink-700)"></b><span>Ink 700</span><em>--ink-700</em></div><div class="sw"><b style="background:var(--ink-500)"></b><span>Ink 500</span><em>--ink-500</em></div><div class="sw"><b style="background:var(--ink-400)"></b><span>Ink 400</span><em>--ink-400</em></div><div class="sw"><b style="background:var(--ink-200)"></b><span>Ink 200</span><em>--ink-200</em></div><div class="sw"><b style="background:var(--ink-100)"></b><span>Ink 100</span><em>--ink-100</em></div></div></body></html>
