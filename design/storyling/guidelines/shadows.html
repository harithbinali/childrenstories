<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Navy-tinted soft lift, sticker border, chunky edge" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row" style="gap:22px;padding:6px"><div style="text-align:center"><b style="display:block;width:110px;height:90px;background:#fff;border-radius:24px;box-shadow:var(--shadow-soft)"></b><span class="k" style="display:block;margin-top:14px">soft</span></div><div style="text-align:center"><b style="display:block;width:110px;height:90px;background:#fff;border-radius:24px;box-shadow:var(--shadow-card)"></b><span class="k" style="display:block;margin-top:14px">card</span></div><div style="text-align:center"><b style="display:block;width:110px;height:90px;background:#fff;border-radius:24px;box-shadow:var(--shadow-float)"></b><span class="k" style="display:block;margin-top:14px">float</span></div><div style="text-align:center"><b style="display:block;width:110px;height:90px;background:var(--tint-sky);border-radius:24px;box-shadow:var(--shadow-sticker)"></b><span class="k" style="display:block;margin-top:14px">sticker</span></div><div style="text-align:center"><b style="display:block;width:110px;height:90px;background:var(--sun-400);border-radius:24px;box-shadow:0 6px 0 var(--sun-600)"></b><span class="k" style="display:block;margin-top:14px">chunky edge</span></div></div></body></html>
