<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--bubble-500)"></b><span>Bubblegum</span><em>--bubble-500 · #FF6AAA</em></div><div class="sw"><b style="background:var(--mint-500)"></b><span>Mint</span><em>--mint-500 · #34C185</em></div><div class="sw"><b style="background:var(--tangerine-500)"></b><span>Tangerine</span><em>--tangerine-500 · #FF8838</em></div><div class="sw"><b style="background:var(--grape-500)"></b><span>Grape</span><em>--grape-500 · #8B6CF0</em></div><div class="sw"><b style="background:var(--bubble-600)"></b><span>Bubble edge</span><em>--bubble-600</em></div><div class="sw"><b style="background:var(--grape-600)"></b><span>Grape edge</span><em>--grape-600</em></div></div></body></html>
