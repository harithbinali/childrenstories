<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status colours + soft backgrounds" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--success)"></b><span>Success</span><em>--success</em></div><div class="sw"><b style="background:var(--success-soft)"></b><span>Success soft</span><em>--success-soft</em></div><div class="sw"><b style="background:var(--warning)"></b><span>Warning</span><em>--warning</em></div><div class="sw"><b style="background:var(--warning-soft)"></b><span>Warning soft</span><em>--warning-soft</em></div><div class="sw"><b style="background:var(--danger)"></b><span>Danger</span><em>--danger</em></div><div class="sw"><b style="background:var(--danger-soft)"></b><span>Danger soft</span><em>--danger-soft</em></div><div class="sw"><b style="background:var(--info)"></b><span>Info</span><em>--info</em></div><div class="sw"><b style="background:var(--info-soft)"></b><span>Info soft</span><em>--info-soft</em></div></div></body></html>
