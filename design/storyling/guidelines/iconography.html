<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row" style="gap:18px;font-size:30px;align-items:center"><i class="ph-fill ph-book-open-text" style="color:var(--blue-500)"></i><i class="ph-fill ph-magic-wand" style="color:var(--grape-500)"></i><i class="ph-fill ph-star" style="color:var(--sun-400)"></i><i class="ph-fill ph-moon-stars" style="color:var(--night-700)"></i><i class="ph-fill ph-cloud" style="color:var(--blue-400)"></i><i class="ph-fill ph-rainbow" style="color:var(--bubble-500)"></i><i class="ph-fill ph-heart" style="color:var(--cherry-500)"></i><i class="ph-fill ph-rocket-launch" style="color:var(--tangerine-500)"></i><i class="ph-fill ph-palette" style="color:var(--mint-500)"></i><i class="ph-fill ph-speaker-high" style="color:var(--blue-600)"></i><i class="ph-fill ph-crown" style="color:var(--sun-500)"></i><i class="ph-fill ph-sparkle" style="color:var(--bubble-400)"></i></div>
<div class="row" style="gap:14px;margin-top:18px"><span style="width:58px;height:58px;border-radius:18px;background:var(--tint-sun);display:grid;place-items:center;transform:rotate(-4deg);box-shadow:var(--shadow-sticker)"><i class="ph-duotone ph-book-open-text" style="font-size:32px;color:var(--ink-900)"></i></span><span style="width:58px;height:58px;border-radius:18px;background:var(--tint-sky);display:grid;place-items:center;transform:rotate(-4deg);box-shadow:var(--shadow-sticker)"><i class="ph-duotone ph-lightbulb" style="font-size:32px;color:var(--ink-900)"></i></span><span style="width:58px;height:58px;border-radius:18px;background:var(--tint-grape);display:grid;place-items:center;transform:rotate(-4deg);box-shadow:var(--shadow-sticker)"><i class="ph-duotone ph-moon-stars" style="font-size:32px;color:var(--ink-900)"></i></span><span style="width:58px;height:58px;border-radius:18px;background:var(--tint-mint);display:grid;place-items:center;transform:rotate(4deg);box-shadow:var(--shadow-sticker)"><i class="ph-duotone ph-shield-check" style="font-size:32px;color:var(--ink-900)"></i></span><span style="width:58px;height:58px;border-radius:18px;background:var(--tint-bubble);display:grid;place-items:center;transform:rotate(4deg);box-shadow:var(--shadow-sticker)"><i class="ph-duotone ph-paint-brush" style="font-size:32px;color:var(--ink-900)"></i></span></div></body></html>
