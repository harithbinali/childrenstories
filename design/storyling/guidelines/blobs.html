<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row" style="gap:28px"><div style="text-align:center"><b style="display:block;width:120px;height:120px;background:var(--tint-sky);border-radius:var(--radius-blob-1);box-shadow:var(--shadow-sticker)"></b><span class="k" style="display:block;margin-top:10px">blob-1</span></div><div style="text-align:center"><b style="display:block;width:120px;height:120px;background:var(--tint-bubble);border-radius:var(--radius-blob-2);box-shadow:var(--shadow-sticker)"></b><span class="k" style="display:block;margin-top:10px">blob-2</span></div><div style="text-align:center"><b style="display:block;width:120px;height:120px;background:var(--tint-mint);border-radius:var(--radius-blob-3);box-shadow:var(--shadow-sticker)"></b><span class="k" style="display:block;margin-top:10px">blob-3</span></div><div style="text-align:center"><b style="display:block;width:120px;height:120px;background:var(--tint-sun);border-radius:var(--radius-blob-4);box-shadow:var(--shadow-sticker)"></b><span class="k" style="display:block;margin-top:10px">blob-4</span></div></div></body></html>
