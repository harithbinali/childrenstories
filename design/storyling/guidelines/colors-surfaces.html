<!-- @dsCard group="Colors" viewport="700x150" name="Paper & night surfaces" subtitle="Warm page whites; night for bedtime mode" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.sw b{display:block;height:64px;border-radius:18px;box-shadow:var(--shadow-xs)}.sw span{display:block;font:800 12px/1.3 var(--font-body);color:var(--ink-900);margin-top:8px}.sw em{display:block;font:600 11px/1.3 var(--font-mono);font-style:normal;color:var(--ink-500)}.k{font:600 11px/1.3 var(--font-mono);color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><b style="background:var(--white)"></b><span>White</span><em>--white</em></div><div class="sw"><b style="background:var(--paper)"></b><span>Paper</span><em>--paper · #FFFBF2</em></div><div class="sw"><b style="background:var(--paper-2)"></b><span>Paper 2</span><em>--paper-2</em></div><div class="sw"><b style="background:var(--paper-3)"></b><span>Paper 3</span><em>--paper-3</em></div><div class="sw"><b style="background:var(--night-900)"></b><span>Night</span><em>--night-900 · #151D4C</em></div><div class="sw"><b style="background:var(--night-700)"></b><span>Night 700</span><em>--night-700</em></div></div></body></html>
